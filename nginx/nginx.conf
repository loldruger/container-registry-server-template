worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/conf.d/*.conf; # Certbot configuration will be included here
    server {
        listen 80;
        listen [::]:80;

        server_name ${REGISTRY_DOMAIN};

        # This location must be accessible for Certbot challenges
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Handle all other HTTP traffic
        location / {
            # Certbot will add its own include for redirects, which will override this
            # if a redirect is desired. Otherwise, this will just serve on HTTP.
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl;
        server_name ${REGISTRY_DOMAIN};

        # SSL Certificates
        ssl_certificate     /etc/nginx/certs/domain.crt;
        ssl_certificate_key /etc/nginx/certs/domain.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Disable client body size limit for large image pushes
        client_max_body_size 0;

        location / {
            # Basic Authentication
            auth_basic "Registry Realm";
            auth_basic_user_file /etc/nginx/auth/htpasswd;

            # Proxy pass to the registry service
            proxy_pass http://registry:5000;
            
            # Set headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 900;
        }
    }
}
